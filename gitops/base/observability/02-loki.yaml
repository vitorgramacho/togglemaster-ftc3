# =============================================================================
# ArgoCD Application: Loki (logs centralizados - Versão Otimizada AWS Academy)
# ---------------------------------------------------------------------------
# Modo "SingleBinary" (1 pod único read+write+gateway) com limites de memória
# e retenção reduzidos para caber em clusters t3.medium.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.16.0
    helm:
      releaseName: loki
      values: |
        # ---------- Modo de deploy ----------
        deploymentMode: SingleBinary

        # ---------- Configuração principal do Loki ----------
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: 'filesystem'
          schemaConfig:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          # Limites enxutos para consumir o mínimo de RAM
          limits_config:
            retention_period: 12h
            max_query_series: 1000
            max_query_parallelism: 4
            ingestion_rate_mb: 4
            ingestion_burst_size_mb: 8
            allow_structured_metadata: true
            volume_enabled: true
          # O módulo ruler-storage tenta inicializar por padrão e escrever em
          # disco. Apontamos explicitamente para um caminho DENTRO do emptyDir
          # gravável (/var/loki), evitando o "read-only file system" no /var/loki/rules.
          rulerConfig:
            storage:
              type: local
              local:
                directory: /var/loki/rules

        # ---------- Componentes ----------
        singleBinary:
          replicas: 1
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          # persistence via PVC (gp2) exige o EBS CSI driver + a LabRole com
          # permissão de criar volumes EBS. No AWS Academy isso falha (o PVC
          # fica "Pending"). Por isso desligamos a persistence...
          persistence:
            enabled: false
          # ...MAS o Loki PRECISA de um diretório gravável em /var/loki. Com o
          # rootfs read-only e sem PVC, ele crashava com:
          #   "mkdir /var/loki: read-only file system / error initialising
          #    module: ruler-storage"
          # A solução é montar um emptyDir (efêmero, na memória/disco do nó)
          # explicitamente em /var/loki. Os dados não sobrevivem a um restart
          # do pod — aceitável para a demo da Fase 4.
          extraVolumes:
            - name: loki-data
              emptyDir: {}
          extraVolumeMounts:
            - name: loki-data
              mountPath: /var/loki

        # ---------- Gateway ----------
        gateway:
          enabled: false   # -1 pod: no SingleBinary consumidores falam direto com o service loki:3100

        # ---------- Desabilitar componentes não-usados em SingleBinary ----------
        backend:        { replicas: 0 }
        read:           { replicas: 0 }
        write:          { replicas: 0 }
        ingester:       { replicas: 0 }
        querier:        { replicas: 0 }
        queryFrontend:  { replicas: 0 }
        queryScheduler: { replicas: 0 }
        distributor:    { replicas: 0 }
        compactor:      { replicas: 0 }
        indexGateway:   { replicas: 0 }
        bloomCompactor: { replicas: 0 }
        bloomGateway:   { replicas: 0 }

        # ---------- Cache ----------
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false

        # ---------- Test pods e monitoramento ----------
        test:
          enabled: false
        lokiCanary:
          enabled: false
        monitoring:
          dashboards: { enabled: false }
          rules:      { enabled: false }
          serviceMonitor:
            enabled: true
            labels:
              release: kps
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
